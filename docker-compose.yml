# Local demo configuration. Only the API and dashboard are published,
# both bound to loopback unless the operator explicitly changes the bind address.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ALLOW_MOCK_DIAGNOSTICS=${ALLOW_MOCK_DIAGNOSTICS:-false}
    ports:
      - "${PREDMAINT_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - model_data:/app/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    environment:
      - API_URL=http://api:8000
    ports:
      - "${PREDMAINT_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  model_data:
