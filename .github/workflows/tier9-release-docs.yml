name: Tier 9 - Verified Documentation Publish

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/tier9-release-docs.yml"
  workflow_run:
    workflows: ["Tier 8 - Canary Deployment Verification"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Build verifiable MkDocs site and publish on trusted events
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install documentation build dependencies
        run: python -m pip install "mkdocs-material>=9.5,<10"
      - name: Build documentation and validate all navigation links
        run: python -m mkdocs build --strict --site-dir site
      - name: Upload built documentation for review
        uses: actions/upload-artifact@v7
        with:
          name: predictive-maintenance-docs
          path: site/
          if-no-files-found: error
      - name: Publish verified site to GitHub Pages branch
        if: ${{ github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
