name: Container-Security-Scan

on:
  push:
    branches: [ main ]
    paths: ["Dockerfile", ".github/workflows/container-scan.yml"]
  pull_request:
    branches: [ main ]
    paths: ["Dockerfile", ".github/workflows/container-scan.yml"]
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC
  workflow_dispatch: {}

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # Build image with latest tag for scanning
      - name: 🏗 Build Docker image
        run: |
          docker build -t predmaint-scan:ci .

      # Trivy vulnerability scan
      - name: 🔎 Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: predmaint-scan:ci
          format: json
          output: trivy-image-results.json
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Report finding locations without relaxing security gate
        if: always()
        run: |
          if [ -s trivy-image-results.json ]; then
            jq -r '.Results[] | select(.Vulnerabilities and (.Vulnerabilities | length > 0)) | .Target as $target | .Vulnerabilities[] | "\\($target) \\(.PkgName)@\\(.InstalledVersion) \\(.VulnerabilityID)"' trivy-image-results.json
          fi

      # Generate SPDX SBOM
      - name: 📜 Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: predmaint-scan:ci
          format: spdx-json
          output: sbom.spdx.json

      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: SBOM
          path: sbom.spdx.json
