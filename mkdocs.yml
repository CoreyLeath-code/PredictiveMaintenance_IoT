site_name: PredictiveMaintenance IoT Docs
site_url: https://coreyleath-code.github.io/PredictiveMaintenance_IoT/
repo_name: CoreyLeath-code/PredictiveMaintenance_IoT
repo_url: https://github.com/CoreyLeath-code/PredictiveMaintenance_IoT
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.path
    - content.code.copy
    - toc.follow

nav:
  - Overview: index.md
  - Engineering decisions: engineering-decisions.md
  - Automation: automation/N8N.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - tables
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight

plugins:
  - search
